<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CTA Button Block</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="field">
    <label for="btn-url">URL</label>
    <input type="text" id="btn-url" placeholder="https://…">
  </div>

  <div class="field">
    <label for="btn-title">Buttontekst</label>
    <input type="text" id="btn-title" placeholder="Bijv. Ons aanbod voor kleuteronderwijs">
  </div>

  <div class="field">
    <label>Kleur</label>
    <div class="color-grid">
      <div class="color-option">
        <input type="radio" name="color" id="c-orange" value="#e9860d">
        <label for="c-orange">
          <span class="color-swatch" style="background:#e9860d"></span>
          Oranje
        </label>
      </div>
      <div class="color-option">
        <input type="radio" name="color" id="c-lightgreen" value="#afca14">
        <label for="c-lightgreen">
          <span class="color-swatch" style="background:#afca14"></span>
          Lichtgroen
        </label>
      </div>
      <div class="color-option">
        <input type="radio" name="color" id="c-pink" value="#e72d52">
        <label for="c-pink">
          <span class="color-swatch" style="background:#e72d52"></span>
          Roze
        </label>
      </div>
      <div class="color-option">
        <input type="radio" name="color" id="c-green" value="#29af8a">
        <label for="c-green">
          <span class="color-swatch" style="background:#29af8a"></span>
          Groen
        </label>
      </div>
      <div class="color-option">
        <input type="radio" name="color" id="c-blue" value="#1895d3">
        <label for="c-blue">
          <span class="color-swatch" style="background:#1895d3"></span>
          Blauw
        </label>
      </div>
    </div>
  </div>

  <div class="preview-box">
    <p>Voorbeeld</p>
    <a id="preview-btn" href="#">Buttontekst</a>
  </div>

  <canvas id="measure-canvas" style="display:none"></canvas>

  <script src="main.js"></script>
</body>
</html>
